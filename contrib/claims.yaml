    decl: HilbertSchmidt.fredholmDet_comp_comm_rect
    kind: theorem
    summary: "Rectangular Sylvester identity det_E(1 - zAB) = det_F(1 - zBA) for Hilbert-Schmidt A : F -> E, B : E -> F between different Hilbert spaces and every z; via corners on WithLp 2 (E x F) and the isometry transfer. Bounded-factor variants included."
    file: Airy1GumbelContrib/FredholmDet/BlockDet.lean
    status: internal
    keywords: [fredholm-determinant, sylvester, cyclicity, hilbert-schmidt, block-operator]
  - id: airy1-gumbel-lean-contrib/fredholm-det-block-triangular
    decl: HilbertSchmidt.fredholmDet_blockOp_upper
    kind: theorem
    summary: On WithLp 2 (E x F), det(1 - z[[A, X], [0, D]]) = det(1 - zA) det(1 - zD) for trace-class A, D and rectangular trace-class X, every z (lower-triangular twin fredholmDet_blockOp_lower); multiplicativity plus a square-zero trace-zero corner.
    file: Airy1GumbelContrib/FredholmDet/BlockDet.lean
    status: internal
    keywords: [fredholm-determinant, block-operator, triangular, trace-class]
  - id: airy1-gumbel-lean-contrib/fredholm-det-block-schur
    decl: HilbertSchmidt.fredholmDet_blockOp_schur'
    kind: theorem
    summary: Block Schur step det(1 - [[A, B], [C, D]]) = det(1 - A) det(1 - (D + C R B)) for trace-class A, D, rectangular trace-class B, C and R (1 - A) = 1 (Neumann-series form fredholmDet_blockOp_schur_of_norm_lt_one); used for the two-time factorization.
    file: Airy1GumbelContrib/FredholmDet/BlockDet.lean
    status: internal
    keywords: [fredholm-determinant, block-operator, schur-complement, lu-factorization]
  - id: airy1-gumbel-lean-contrib/two-time-block-bridge
    decl: AiryFdd.airy1FinCdf_pair_eq_blockDet
    kind: theorem
    summary: "For times t0 < t1 with gap d > 0 and levels x1, x2, airy1FinCdf {t0,t1} = det(I - [[B, Q], [K21, D]]) on L2 + L2: B = P_1 B0 P_1, Q = P_1 B0 Pbar_1 e^{d Lap} P_2, K21 = P_2 e^{-d Lap} B0 P_1, D = P_2 e^{-d Lap} B0 Pbar_1 e^{d Lap} P_2."
    file: Airy1GumbelContrib/TwoTime/TwoTimeBridge.lean
    status: internal
    keywords: [fredholm-determinant, airy1, fdd, two-time, block-operator, sylvester]
  - id: airy1-gumbel-lean-contrib/two-time-fddop-block-det
    decl: AiryFdd.fredholmDet_fddOp_two_level
    kind: theorem
    summary: The two-time fdd operator factors as R o C (bounded row; rectangular trace-class column composed with W at weight 2(d+1)); the bounded-factor rectangular Sylvester identity gives det(1 - z fddOp) = det(1 - z blockOp B Q K21 D) for every z.
    file: Airy1GumbelContrib/TwoTime/TwoTimeBridge.lean
    status: internal
    keywords: [fredholm-determinant, fdd, block-operator, trace-class, hilbert-schmidt]
  - id: airy1-gumbel-lean-contrib/two-time-schur-factorisation
    decl: AiryFdd.airy1FinCdf_pair_eq_singleton_mul_schur
    kind: theorem
    summary: "For t0 < t1, gap d > 0, levels x1, x2 and any left inverse R of 1 - B (B = goeOp x1): airy1FinCdf {t0,t1} = F_{t0}(x1) det(I - Z), Z = D + K21 R Q trace class; Neumann form with R = (1 - B)^{-1} when norm B < 1."
    file: Airy1GumbelContrib/TwoTime/TwoTimeSchur.lean
    status: internal
    keywords: [fredholm-determinant, airy1, fdd, two-time, schur-complement, block-operator]
  - id: airy1-gumbel-lean-contrib/two-time-excess-bound
    decl: AiryFdd.abs_airy1FinCdf_pair_const_sub_sq_le
    kind: theorem
    summary: "At times {0,d} and equal levels w, with f = airy1FinCdf {0} w, B = goeOp w and R a left inverse of 1 - B: |F - f^2| <= |f| 2 ||Z - B||_1 exp(2(||Z||_1 + ||B||_1)), where F - f^2 = f (det(I - Z) - det(I - B)) and Z - B = (D - B) + K21 R Q."
    file: Airy1GumbelContrib/TwoTime/TwoTimeSchur.lean
    status: internal
    keywords: [fredholm-determinant, airy1, two-time, excess, simon-bound, trace-norm]
  - id: airy1-gumbel-lean-contrib/two-time-d-minus-b
    decl: AiryFdd.dOp_sub_goeOp
    kind: theorem
    summary: At equal levels w and gap d > 0, D - B = -(K21 T), where K21 T is a single L2 kernel operator (composition of K21 with T = P e^{d Lap} P, which is not HS), via the heat-Airy semigroup.
    file: Airy1GumbelContrib/TwoTime/TwoTimeKernel.lean
    status: internal
    keywords: [airy1, two-time, kernel-identity, heat-semigroup]
  - id: airy1-gumbel-lean-contrib/two-time-k21-trace-norm
    decl: AiryFdd.traceENorm_k21Op_le
    kind: theorem
    summary: For w >= 0, d > 0, the trace norm of K21 = P e^{-d Lap} B0 P is at most C exp(-Psi(d,w) + 16(1+w+d^2)), Psi = (2/3)(2w+d^2)^{3/2} + 2wd + (2/3)d^3, via the heat split at tuned weight gamma = s + sqrt(2w+s^2).
    file: Airy1GumbelContrib/TwoTime/TwoTimeEst.lean
    status: internal
    keywords: [airy1, two-time, trace-norm, two-point-bound]
  - id: airy1-gumbel-lean-contrib/two-time-excess-trace-norm
    decl: AiryFdd.traceENorm_twoTimeExcess_le_rate
    kind: theorem
    summary: There is C > 0 such that for w >= 0, d > 0 and every bounded R with norm <= 2, the trace norm of (D - B) + K21 R Q is at most C exp(-I(w) - 2wd + 20(1+w+d^2)), I(w) = (2/3)(2w)^{3/2}.
    file: Airy1GumbelContrib/TwoTime/TwoTimeEst.lean
    status: internal
    keywords: [airy1, two-time, trace-norm, two-point-bound]
  - id: airy1-gumbel-lean-contrib/two-time-qd-nonvanishing
    decl: AiryFdd.exists_dKer_ne_zero
    kind: theorem
    summary: For all levels x1, x2 and d > 0 there are u, m past the cuts with qKer(u, m) != 0 and dKer(u, m) != 0 (the inner integral of G(u+y) 1_{y<=x1} p_d(y-m) tends, after normalising, to G(u+x1) as m -> infinity).
    file: Airy1GumbelContrib/TwoTime/TwoTimeNonvanishing.lean
    status: internal
    keywords: [airy1, two-time, block-operator, nonvanishing, laplace-method]
  - id: airy1-gumbel-lean-contrib/two-time-excess-trace-norm-sharp
    decl: AiryFdd.traceENorm_twoTimeExcess_le_sharp
    kind: theorem
    summary: There is C > 0 such that for w >= 1/2, d > 0 and bounded R with norm <= 2, the trace norm of (D - B) + K21 R Q is at most C(1+w+d)^2 exp(-Psi(d,w)) (heat time 1/(1+w+d)^2, ||Q|| <= C(1+d); polynomial prefactor not optimised).
    file: Airy1GumbelContrib/TwoTime/TwoTimeSharp.lean
    status: internal
    keywords: [airy1, two-time, trace-norm, sharp]
  - id: airy1-gumbel-lean-contrib/two-time-excess-trace-norm-sqrt
    decl: AiryFdd.traceENorm_twoTimeExcess_le_sqrt
    kind: theorem
    summary: There is C > 0 with, for w >= 1/2, d > 0 and bounded R with norm <= 2, trace norm of (D - B) + K21 R Q <= C sqrt(1+w+d) sqrt(1+d) exp(-Psi(d,w)) (sharp exponent Psi; prefactor not claimed optimal).
    file: Airy1GumbelContrib/TwoTime/TwoTimeSharpSqrt.lean
    status: internal
    keywords: [airy1, two-time, trace-norm, sharp]
  - id: airy1-gumbel-lean-contrib/two-time-excess-trace-norm-d
    decl: AiryFdd.traceENorm_twoTimeExcess_le_d
    kind: theorem
    summary: There is C > 0 with, for w >= 1/2, d > 0 and bounded R with norm <= 2, trace norm of (D - B) + K21 R Q <= C sqrt(1+d) exp(-Psi(d,w)) (sharp exponent Psi; sqrt(1+d) from the norm bound on Q; not claimed optimal).
    file: Airy1GumbelContrib/TwoTime/TwoTimeSharpD.lean
    status: internal
    keywords: [airy1, two-time, trace-norm, sharp]
  - id: airy1-gumbel-lean-contrib/two-time-qd-operator-nonvanishing
    decl: AiryFdd.dOp_ne_zero
    kind: theorem
    summary: For all levels x1, x2 and d > 0, dOp is a nonzero operator on L2(R) (a zero kernel operator kills rational interval integrals of a.e. section; the inner integral is continuous in m past the cut); qOp_ne_zero, in the same file, does the same for qOp.
    file: Airy1GumbelContrib/TwoTime/TwoTimeOpNonvanishing.lean
    status: internal
    keywords: [airy1, two-time, block-operator, nonvanishing, kernel-operator]
  - id: airy1-gumbel-lean-contrib/airy-contour
    decl: AiryContour.airyContour_eq_airyAi
    kind: theorem
    summary: "Contour form of Ai (DLMF 9.5.4): for every c > 0 and z in C, Ai(z) = (1/2pi) * integral over s in R of exp((c+is)^3/3 - z(c+is)); real form airyAiReal_eq_integral. Proof: Airy ODE for the integral, ray deformation for the initial data, Taylor uniqueness."
    file: Airy1GumbelContrib/Airy/AiryContour.lean
    status: internal
    keywords: [airy, contour-integral, special-function, uniqueness]
  - id: airy1-gumbel-lean-contrib/airy-fourier
    decl: AiryFourier.fourier_airyAiDist
    kind: theorem
    summary: "Fourier transform of Ai (Mathlib F, kernel exp(-2 pi i x xi)): F Ai = exp(i(2 pi xi)^3/3) in tempered distributions; weak form for integrable phi with integrable F phi. Proof: Gaussian regularisation, contour form on Re t = delta^2, Fubini, dominated convergence."
    file: Airy1GumbelContrib/Airy/AiryFourier.lean
    status: internal
    keywords: [airy, fourier-transform, tempered-distribution, special-function]
  - id: airy1-gumbel-lean-contrib/airy-transform-isometry
    decl: AiryTransform.integral_norm_sq_airyTransformCLM
    kind: theorem
    summary: "Airy transform on Schwartz space: B0 f(x) = integral Ai(x+y) f(y) dy equals F^-1(psi F(f(-.))), psi = exp(i(2 pi xi)^3/3) (airyTransformCLM_apply), and integral |B0 f|^2 = integral |f|^2 for f in S(R, C); via the weak Fourier form of Ai, inversion, Plancherel."
    file: Airy1GumbelContrib/Airy/AiryTransform.lean
    status: internal
    keywords: [airy, airy-transform, fourier-multiplier, plancherel, isometry]
  - id: airy1-gumbel-lean-contrib/airy-transform-l2-contraction
    decl: AiryTransform.eLpNorm_airyTransformFun_le
    kind: theorem
    summary: "Airy transform on L1 cap L2: for k in L1(R) cap L2(R, C), the L2 norm of u -> integral Ai(u+y) k(y) dy is at most the L2 norm of k (real form eLpNorm_integral_airyAiReal_mul_le); by Fatou from the Schwartz isometry via compact-support and truncation approximations."
    file: Airy1GumbelContrib/Airy/AiryTransformL2.lean
    status: internal
    keywords: [airy, airy-transform, l2-contraction, fatou]
  - id: airy1-gumbel-lean-contrib/two-time-q-norm-le-one
    decl: AiryFdd.norm_qOp_le_one
    kind: theorem
    summary: For all levels x1, x2 and every d > 0, the operator norm of the two-time block qOp on L2(R) is at most 1, via Q = P_1 B0 Pbar_1 exp(d Laplacian) P_2, heat contraction and the L1 cap L2 Airy-transform bound.
    file: Airy1GumbelContrib/TwoTime/TwoTimeQNorm.lean
    status: internal
    keywords: [airy1, two-time, block-operator, operator-norm, airy-transform]
  - id: airy1-gumbel-lean-contrib/two-time-excess-trace-norm-e
    decl: AiryFdd.traceENorm_twoTimeExcess_le_e
    kind: theorem
    summary: There is C > 0 with, for w >= 1/2, d > 0 and bounded R with norm <= 2, trace norm of (D - B) + K21 R Q <= C exp(-Psi(d,w)); uses norm_qOp_le_one (L1 cap L2 Airy contraction, not full unitarity); C not optimal.
    file: Airy1GumbelContrib/TwoTime/TwoTimeSharpE.lean
    status: internal
    keywords: [airy1, two-time, trace-norm, sharp]
