schema: claims/1
package: airy1-gumbel-lean-contrib
claims:
  - id: airy1-gumbel-lean-contrib/airy-ai
    decl: Complex.airyAi
    kind: definition
    summary: Airy Ai as an entire function on C via the regularized hypergeometric 0F1~ (DLMF 9.4.1), with Bi (DLMF 9.4.2), values at 0, and the DLMF 9.6.1 Bessel bridge through the Schlaefli K_{1/3} integral.
    file: Airy1GumbelContrib/Airy/Airy.lean
    status: reusable
    keywords: [airy, special-function, hypergeometric, bessel]
  - id: airy1-gumbel-lean-contrib/airy-ode
    decl: iteratedDeriv_two_airyAiReal
    kind: theorem
    summary: The Airy ODE y'' = x*y for airyAiReal (and the complex version), plus half-line ODE uniqueness (Groenwall) in Airy/AiryUniqueness.lean.
    file: Airy1GumbelContrib/Airy/AiryReal.lean
    status: internal
    keywords: [airy, ode, uniqueness]
  - id: airy1-gumbel-lean-contrib/airy-laplace
    decl: airyAiReal_laplace
    kind: theorem
    summary: "The Airy Laplace bound: there is C with ∫_R e^{2βu} Ai(u)^2 du ≤ C e^{(2/3)β^3} for all β ≥ 1 (the paper's Airy Laplace lemma)."
    file: Airy1GumbelContrib/Airy/AiryLaplaceFull.lean
    status: internal
    keywords: [airy, laplace, decay]
  - id: airy1-gumbel-lean-contrib/airy-k13-schlaefli
    decl: schlaefliK13
    kind: definition
    summary: The Schlaefli integral K_{1/3}(z) = ∫_0^∞ e^{-z cosh t} cosh(t/3) dt with Gaussian domination, Laplace-method-ready.
    file: Airy1GumbelContrib/Airy/BesselK13.lean
    status: reusable
    keywords: [bessel, schlaefli, integral-representation]
  - id: airy1-gumbel-lean-contrib/airy-leading-asymptotics
    decl: airyAiReal_isEquivalent
    kind: theorem
    summary: Exact leading asymptotics Ai(x) ~ (1/(2 sqrt(pi))) x^{-1/4} e^{-(2/3) x^{3/2}} as x -> +infty (IsEquivalent), where kappa = 4 sqrt(2)/3 and C* = 2^{1/4}/sqrt(pi) originate.
    file: Airy1GumbelContrib/Airy/AiryLeading.lean
    status: internal
    keywords: [airy, asymptotics, laplace-method]
  - id: airy1-gumbel-lean-contrib/airy-deriv-asymptotics
    decl: deriv_airyAiReal_isEquivalent
    kind: theorem
    summary: Ai'(x) ~ -(1/(2 sqrt(pi))) x^{1/4} e^{-(2/3) x^{3/2}} (IsEquivalent), via the Schlaefli K_{1/3} derivative asymptotics.
    file: Airy1GumbelContrib/Airy/AiryLeading.lean
    status: internal
    keywords: [airy, asymptotics, derivative]
  - id: airy1-gumbel-lean-contrib/airy-tail-asymptotics
    decl: integral_airyAiReal_isEquivalent
    kind: theorem
    summary: The tail integral ∫_A^infty Ai ~ (1/(2 sqrt(pi))) A^{-3/4} e^{-(2/3) A^{3/2}} (IsEquivalent), by a sandwich argument without l'Hopital.
    file: Airy1GumbelContrib/Airy/AiryLeading.lean
    status: internal
    keywords: [airy, tail, asymptotics]
  - id: airy1-gumbel-lean-contrib/gaussian-mills
    decl: gaussianTail_isEquivalent
    kind: theorem
    summary: Mills-ratio Gaussian tail asymptotics (IsEquivalent form) for the quadratic-plus-linear exponent family used by the heat-Airy bounds.
    file: Airy1GumbelContrib/Gaussian/MillsRatio.lean
    status: internal
    keywords: [gaussian, mills-ratio, tail]
  - id: airy1-gumbel-lean-contrib/gumbel-measure
    decl: ProbabilityTheory.gumbelMeasure
    kind: definition
    summary: The standard Gumbel distribution as a probability measure on R, with PDF/CDF and integrability facts.
    file: Airy1GumbelContrib/Gumbel/Gumbel.lean
    status: reusable
    keywords: [gumbel, extreme-value, distribution]
  - id: airy1-gumbel-lean-contrib/hilbert-schmidt
    decl: HilbertSchmidt.IsHilbertSchmidt
    kind: definition
    summary: Hilbert-Schmidt operators via the basis-independent enormous-norm hsENorm; adjoint invariance, two-sided ideal, HS => compact.
    file: Airy1GumbelContrib/HilbertSchmidt/HilbertSchmidt.lean
    status: reusable
    keywords: [hilbert-schmidt, operator-theory, schatten]
  - id: airy1-gumbel-lean-contrib/kernel-hs
    decl: HilbertSchmidt.kernelOperator
    kind: definition
    summary: L^2 integral kernels give Hilbert-Schmidt operators with the HS-norm equality (isHilbertSchmidt_kernelOperator, hsENorm_kernelOperator_eq).
    file: Airy1GumbelContrib/HilbertSchmidt/KernelHS.lean
    status: reusable
    keywords: [integral-kernel, hilbert-schmidt, l2]
  - id: airy1-gumbel-lean-contrib/trace-class
    decl: HilbertSchmidt.IsTraceClass
    kind: definition
    summary: Trace-class operators via HS factorization, with a basis-independent trace, cyclicity (trace_comp_comm), and |Tr(K^m)| <= ||K||_2^m (norm_trace_pow_le).
    file: Airy1GumbelContrib/TraceClass/TraceClass.lean
    status: reusable
    keywords: [trace-class, trace, cyclicity]
  - id: airy1-gumbel-lean-contrib/fredholm-det-two
    decl: HilbertSchmidt.fredholmDetTwo
    kind: definition
    summary: The 2-regularized Fredholm determinant det_2(1+zK) for Hilbert-Schmidt K on the disk ||z||*||K||_2 < 1, as exp of the m>=2 Plemelj series; differentiable, det_2(0)=1, derivative 0 at 0.
    file: Airy1GumbelContrib/TraceClass/FredholmTwo.lean
    status: reusable
    keywords: [fredholm-determinant, regularized-determinant, plemelj]
  - id: airy1-gumbel-lean-contrib/fredholm-det-one
    decl: HilbertSchmidt.fredholmDetOne
    kind: definition
    summary: The trace-class Fredholm determinant det_1(I-zA) on the Plemelj disk, with det_1 = e^{-Tr A} det_2 and the remainder estimate 1 - det_1(1-A) = Tr A + O(||A||_2^2 e^{||A||_2}).
    file: Airy1GumbelContrib/TraceClass/FredholmOne.lean
    status: reusable
    keywords: [fredholm-determinant, trace-class, plemelj]
  - id: airy1-gumbel-lean-contrib/fredholm-cyclicity
    decl: HilbertSchmidt.fredholmDetOne_cyclic
    kind: theorem
    summary: Simon's determinant cyclicity det(I-AB) = det(I-BA) for HS factors, from trace cyclicity; no disk hypothesis.
    file: Airy1GumbelContrib/TraceClass/FredholmOne.lean
    status: internal
    keywords: [fredholm-determinant, cyclicity, simon]
  - id: airy1-gumbel-lean-contrib/airy-kernel-operator
    decl: AiryKernel.airyKernelOp
    kind: definition
    summary: The Airy kernel operator K_s = T_s T_s* on L^2(s,infty) via the Airy-Hankel operator; trace class with ||K_s||_2 -> 0 as s -> +infty.
    file: Airy1GumbelContrib/AiryKernel/AiryKernel.lean
    status: reusable
    keywords: [airy-kernel, trace-class, determinantal]
  - id: airy1-gumbel-lean-contrib/airy-energy-identity
    decl: AiryKernel.airyAiReal_sq_integral
    kind: theorem
    summary: The diagonal Airy energy identity ∫_0^infty Ai(x+t)^2 dt = Ai'(x)^2 - x Ai(x)^2.
    file: Airy1GumbelContrib/AiryKernel/AiryKernel.lean
    status: internal
    keywords: [airy, energy-identity, wronskian]
  - id: airy1-gumbel-lean-contrib/backward-airy
    decl: backwardAiry
    kind: definition
    summary: The backward-Airy kernel g_T(s) = e^{-2T^3/3 - T s} Ai(s + T^2), solving the backward heat equation (backwardAiry_pde).
    file: Airy1GumbelContrib/AiryKernel/BackwardAiry.lean
    status: reusable
    keywords: [airy, heat-equation, backward-kernel]
  - id: airy1-gumbel-lean-contrib/heat-airy-convolution
    decl: heat_airy_conv_tail
    kind: theorem
    summary: Heat-Airy convolution identities of Quastel-Remenik (Prop. 1.2 and (1.9)), including the tail form ∫ G_T(A - s) g_T(s) ds = sqrt(4 pi T) ∫_A^infty Ai, with G_T the Gaussian tail and g_T the backward-Airy kernel.
    file: Airy1GumbelContrib/AiryKernel/BackwardAiry.lean
    status: internal
    keywords: [airy, heat-kernel, convolution, quastel-remenik]
  - id: airy1-gumbel-lean-contrib/reflected-heat-kernel
    decl: AiryConj.heatKernel_reflected_eq
    kind: theorem
    summary: Reflection identity for the conjugate heat kernel Q_{M,T} — the piecewise kernel (free off {x,z <= M}, reflected on it) equals the method-of-images difference of free heat kernels.
    file: Airy1GumbelContrib/AiryKernel/Conjugates.lean
    status: internal
    keywords: [heat-kernel, reflection, method-of-images, conjugate-kernel]
  - id: airy1-gumbel-lean-contrib/conjugate-kernels
    decl: AiryConj.vKernel
    kind: definition
    summary: The conjugate kernels v and w of the Airy_1 maximum upper bound (the setup of the V- and W-kernel bounds, after Quastel-Remenik), with backwardAiryPair and the weight phi(x) = sqrt(1+x^2).
    file: Airy1GumbelContrib/AiryKernel/Conjugates.lean
    status: reusable
    keywords: [airy, conjugate-kernel, hilbert-schmidt, quastel-remenik]
  - id: airy1-gumbel-lean-contrib/conjugate-v-l2-bound
    decl: AiryConj.vKernel_sq_integral_le
    kind: theorem
    summary: "Hilbert-Schmidt bound for the v-kernel: for T > 0 there is C > 0 with ||V_{T,a}||_2^2 <= C (1+M)^2 (1+a^3) e^{2Ta^2-4Ma} for all M > 0, a >= T+1, via the shear substitution and Gaussian moments."
    file: Airy1GumbelContrib/AiryKernel/ConjugateV.lean
    status: internal
    keywords: [airy, hilbert-schmidt, conjugate-kernel, quastel-remenik]
  - id: airy1-gumbel-lean-contrib/conjugate-w-l2-bound
    decl: AiryConj.wKernel_sq_integral_le
    kind: theorem
    summary: "Hilbert-Schmidt bound for the w-kernel: there is C > 0 with ||W_{T,a}||_2^2 <= C e^{(2/3)a^3 - 2Ta^2} for T > 0, a >= T+1, via integrability of exp(beta u) Ai(u)^2 for beta >= 1 (integrable_exp_mul_airyAiReal_sq)."
    file: Airy1GumbelContrib/AiryKernel/ConjugateW.lean
    status: internal
    keywords: [airy, hilbert-schmidt, heat-kernel, quastel-remenik]
  - id: airy1-gumbel-lean-contrib/conjugate-heat-2to2-bound
    decl: AiryConj.eLpNorm_conjugateHeat_conv_le
    kind: theorem
    summary: "L^2 convolution bound for the conjugate heat kernel: ||p~_{L,a} * f||_2 <= e^{L a^2} ||f||_2 (Cauchy-Schwarz/Tonelli; includes the Laplace identity: the integral of e^{-a v} p_L(v) dv equals e^{L a^2})."
    file: Airy1GumbelContrib/AiryKernel/Conjugate2to2.lean
    status: internal
    keywords: [heat-kernel, convolution, young-inequality, lp-spaces]
  - id: airy1-gumbel-lean-contrib/trace-kernel-product
    decl: AiryConj.trace_kernelOperator_comp
    kind: theorem
    summary: Trace of a product of two L^2(R) kernel operators equals the double integral of K(x,z) K'(z,x); with kernelOperator_adjoint and a countable Hilbert basis of L^2(R) (exists_countable_hilbertBasis_L2R).
    file: Airy1GumbelContrib/AiryKernel/TraceProduct.lean
    status: internal
    keywords: [trace-class, kernel-operator, hilbert-schmidt, fredholm-determinant]
  - id: airy1-gumbel-lean-contrib/two-interval-decomp
    decl: AiryTwoInt.twoIntKCup_decomp
    kind: theorem
    summary: The two-interval operator decomposition K~_cup = K~_1 + K~_2 - C~_r as an identity of conjugated kernels, via Chapman-Kolmogorov, the off-diagonal heat-Airy identity heatAiryConv_offset, and the kernel-composition calculus.
    file: Airy1GumbelContrib/TwoInterval/TwoIntervalOps.lean
    status: internal
    keywords: [airy, fredholm-determinant, two-interval, operator-algebra]
  - id: airy1-gumbel-lean-contrib/two-interval-trace-cancellation
    decl: AiryTwoInt.trace_twoIntKCup
    kind: theorem
    summary: Trace cancellation Tr K~_1 + Tr K~_2 - Tr K~_cup = Tr C~_r, conditional on explicit MemLp and IsTraceClass hypotheses (all discharged in trace_twoIntKCup_discharged).
    file: Airy1GumbelContrib/TwoInterval/TwoIntervalOps.lean
    status: internal
    keywords: [trace-class, fredholm-determinant, two-interval, cancellation]
  - id: airy1-gumbel-lean-contrib/heat-kernel-cdf-convolution
    decl: AiryConj.heatKernel_conv_cdf
    kind: theorem
    summary: Gaussian convolution-CDF identity ∫_{z<=M} p_L(M+α-z) p_1(M-z+β) dz = p_{L+1}(α-β) Φ(-(α+Lβ)/sqrt(2L(L+1))), used for the FR and RR sector integrals of the two-interval trace.
    file: Airy1GumbelContrib/AiryKernel/GaussianSaddle.lean
    status: internal
    keywords: [gaussian, convolution, normal-cdf, saddle-point]
  - id: airy1-gumbel-lean-contrib/saddle-bound
    decl: AiryConj.saddleF_ge
    kind: theorem
    summary: Saddle bound F(delta) >= J_M(r) + (delta - delta*)^2/2 for M, r >= 1 and delta in the admissible range, with the exact critical identity F(delta*) = J_M(r); assumes 2 <= saddleR, which holds in the regime r <= chi sqrt(2M).
    file: Airy1GumbelContrib/AiryKernel/GaussianSaddle.lean
    status: internal
    keywords: [saddle-point, taylor-bound, airy, two-interval]
  - id: airy1-gumbel-lean-contrib/uphi-hs-bound
    decl: AiryConj.uphi_hs_le
    kind: theorem
    summary: Hilbert-Schmidt bound ||U_a Q_{M,T} P_L U_a Phi||_HS <= C_T (1+M+L)^K exp(L a^2 + T a^2 - a^3) for a = sqrt(2M) >= T+1, via a factorization through the v-kernel and a Young L^2 convolution bound.
    file: Airy1GumbelContrib/AiryKernel/ConjugateUPhi.lean
    status: internal
    keywords: [hilbert-schmidt, young-inequality, conjugate-kernel, airy]
  - id: airy1-gumbel-lean-contrib/sharp-tail-trace-expansion
    decl: AiryConj.trace_airyTilde_eq_heat_exact
    kind: theorem
    summary: For T > 0, M > 0, a >= T+1, the conjugated operator A~_{M,T} = V W has trace -2T Ai'(2M) + ∫_{2M}^infty Ai(u) du + errorMT(M,T); via the unweighted kernel integral and a heat-kernel split.
    file: Airy1GumbelContrib/AiryKernel/TraceExpansion.lean
    status: internal
    keywords: [airy, fredholm-determinant, trace-class, sharp-tail]
  - id: airy1-gumbel-lean-contrib/sharp-tail-remainder-bound
    decl: AiryConj.errorMT_abs_le
    kind: theorem
    summary: "Remainder bound: for T > 0 there is C with |errorMT M T| <= C M^{-3/4} exp(-2TM - (2/3)(2M)^{3/2}) for M >= 1, the kappa M^{3/2} exponent of rho(M)."
    file: Airy1GumbelContrib/AiryKernel/TraceExpansion.lean
    status: internal
    keywords: [airy, remainder, asymptotic, sharp-tail]
  - id: airy1-gumbel-lean-contrib/two-interval-trace-formula
    decl: AiryTwoInt.trace_crKerT_eq
    kind: theorem
    summary: Two-interval trace formula Tr C~_r = ∫∫ A_r(x,w) W_{S,a}(w,x), from the pointwise kernel factorization C~_r = A_r W_{S,a} (crKerT_eq_compKernel_aRKer_wSKer) and kernelOperator_compKernel; conditional on explicit MemLp data.
    file: Airy1GumbelContrib/TwoInterval/TwoIntervalTrace.lean
    status: internal
    keywords: [trace-class, two-interval, fredholm-determinant, airy]
  - id: airy1-gumbel-lean-contrib/two-interval-sector-decomposition
    decl: AiryTwoInt.trace_crKerT_eq_sectors
    kind: theorem
    summary: Four-sector trace decomposition Tr C~_r = Tr C_r^RR + Tr C_r^RF + Tr C_r^FR + Tr C_r^FF, via the weight cancellation Tr C~_r = Tr C_r and a four-level Tonelli chain (conditional on the MemLp data).
    file: Airy1GumbelContrib/TwoInterval/TwoIntervalTrace.lean
    status: internal
    keywords: [two-interval, trace-class, sector-decomposition, airy]
  - id: airy1-gumbel-lean-contrib/two-interval-membership
    decl: AiryTwoInt.isTraceClass_kcupKerT
    kind: theorem
    summary: Trace-class membership of K~_cup for r > 0, M > 0, r + 3 <= a (likewise K~_1, K~_2, C~_r in the same file), via the V, W, L^2-convolution and U-Phi bounds and the dominations 0 <= Q P_r Q <= Q P_L and 0 <= D_r <= Q P_L + P_L Q.
    file: Airy1GumbelContrib/TwoInterval/TwoIntervalMembership.lean
    status: internal
    keywords: [trace-class, hilbert-schmidt, two-interval, membership]
  - id: airy1-gumbel-lean-contrib/two-interval-trace-cancellation-discharged
    decl: AiryTwoInt.trace_twoIntKCup_discharged
    kind: theorem
    summary: Trace cancellation Tr K~_1 + Tr K~_2 - Tr K~_cup = Tr C~_r for r > 0, M > 0, r + 3 <= a, with all MemLp and IsTraceClass hypotheses proved.
    file: Airy1GumbelContrib/TwoInterval/TwoIntervalMembership.lean
    status: internal
    keywords: [trace-class, two-interval, cancellation, fredholm-determinant]
  - id: airy1-gumbel-lean-contrib/sharp-tail-expansion
    decl: AiryConj.piT_sub_traceLead_isLittleO
    kind: theorem
    summary: "Two-term sharp tail: for T > 0, pi_T(M) = 1 - det_1(1 - A~_{M,T}) satisfies pi_T(M) = T rho(M) + rho(M)/(4M) + o(rho(M)/M) as M -> infinity."
    file: Airy1GumbelContrib/AiryKernel/TailAsymptotic.lean
    status: internal
    keywords: [airy, sharp-tail, asymptotics, fredholm-determinant]
  - id: airy1-gumbel-lean-contrib/airy-derivative-rate
    decl: AiryConj.neg_deriv_airyAiReal_sub_lead_isBigO
    kind: theorem
    summary: Airy-derivative rate -Ai'(A) = (1/(2 sqrt pi)) A^{1/4} e^{-(2/3) A^{3/2}} (1 + O(A^{-3/2})), from O(1/z) Schlaefli rates via the airyBesselY1 derivative formula; with the exact constant identity 2*leadAi'(2M) = rho(M).
    file: Airy1GumbelContrib/AiryKernel/TailAsymptotic.lean
    status: internal
    keywords: [airy, derivative, asymptotics, schlaefli]
  - id: airy1-gumbel-lean-contrib/fr-exponent-calculus
    decl: AiryTwoInt.frI1Plus_exp_int_le
    kind: theorem
    summary: "FR-sector Gaussian mass bound: for M, r >= 1 and saddleR >= 2, ∫_{h1Dom} e^{-h1Exp} <= C (r+1)^{1/2} e^{-J_M(r)}, by an elementary d-split; with the h1Exp lower bounds and the G_1/G_{2,-} negative-Airy estimates."
    file: Airy1GumbelContrib/TwoInterval/FRExponents.lean
    status: internal
    keywords: [airy, two-interval, saddle-point, gaussian]
  - id: airy1-gumbel-lean-contrib/heat-kernel-cdf-convolution-reflection
    decl: AiryTwoInt.heatKernel_conv_cdf_Ioi
    kind: theorem
    summary: Reflected truncated heat-kernel convolution ∫_0^infty p_1(alpha+w) p_r(gamma+w) dw = p_{r+1}(gamma-alpha) Phi(-(r*alpha+gamma)/sqrt(2r(r+1))), with Chernoff bounds frI1_Jbound and frI2_Kbound.
    file: Airy1GumbelContrib/TwoInterval/FRExponents.lean
    status: internal
    keywords: [gaussian, convolution, normal-cdf, two-interval]
  - id: airy1-gumbel-lean-contrib/detone-lin-rem-bound
    decl: AiryTwoInt.joint_detOne_comb_abs_le
    kind: theorem
    summary: "|1 - det_1(K1) - det_1(K2) + det_1(Kcup) - Tr Cr| <= C M^K (1+r)^K e^{-2 kappa M^{3/2}} for M >= M_0(chi), 1 <= r <= chi sqrt(2M), r + 3 <= sqrt(2M) (two-interval determinants at a = sqrt(2M)), via HS bounds on the det_1 linearization remainder."
    file: Airy1GumbelContrib/TwoInterval/TwoIntervalDetRem.lean
    status: internal
    keywords: [fredholm-determinant, hilbert-schmidt, two-interval, remainder]
  - id: airy1-gumbel-lean-contrib/step-five-sums-o-rho
    decl: AiryTwoInt.stepFive_first_sum_ratio_tendsto_zero
    kind: theorem
    summary: C M^K sum_{1<=r<=chi sqrt(2M)} (1+r)^K e^{-J_M(r)} = o(M^{1/4} e^{-kappa M^{3/2}}) as M -> infinity (kappa = 4 sqrt2/3), via exp(-J_M(r)) <= exp(-kappa M^{3/2}) exp(-2Mr) and a geometric majorant; a remainder sum of the separated-block estimate.
    file: Airy1GumbelContrib/TwoInterval/TwoIntervalSumEst.lean
    status: internal
    keywords: [airy, two-interval, little-o, summation, gumbel]
  - id: airy1-gumbel-lean-contrib/sector-rr-trace-bound
    decl: AiryTwoInt.trSectorRR_abs_le
    kind: theorem
    summary: "RR-sector trace bound: |Tr C_r^RR| <= C_1 e^{-J_M(r)} + C_2 e^{-c_2 M^2} for 1 <= r <= chi sqrt(2M), M >= M_0(chi), via a pair change of variables, a Chernoff-envelope dominator, and saddle/boundary estimates."
    file: Airy1GumbelContrib/TwoInterval/SectorRR.lean
    status: internal
    keywords: [airy, two-interval, sector-estimate, change-of-variables, saddle-point]
  - id: airy1-gumbel-lean-contrib/sector-fr-trace-bound
    decl: AiryTwoInt.abs_trSectorFR_le_absorbed
    kind: theorem
    summary: "FR-sector trace bound: |Tr C_r^FR| <= C_chi (1+r)^{1/2} e^{-J_M(r)} for 1 <= r <= chi sqrt(2M), M >= M_0(chi), via a two-part kernel split, exact Gaussian inner evaluations, and four piece bounds with the FR exponent calculus."
    file: Airy1GumbelContrib/TwoInterval/SectorFR.lean
    status: internal
    keywords: [airy, two-interval, sector-estimate, fredholm-determinant, saddle-point]
  - id: airy1-gumbel-lean-contrib/sector-rf-trace-bound
    decl: AiryTwoInt.abs_trSectorRF_le_absorbed
    kind: theorem
    summary: "RF-sector trace bound: |Tr C_r^RF| <= C_chi (1+r)^{1/2} e^{-J_M(r)} for 1 <= r <= chi sqrt(2M), M >= M_0(chi), via the involution trSectorRF_eq_trSectorFR reducing to the FR bound."
    file: Airy1GumbelContrib/TwoInterval/SectorRF.lean
    status: internal
    keywords: [airy, two-interval, sector-estimate, involution]
  - id: airy1-gumbel-lean-contrib/sector-ff-trace-bound
    decl: AiryTwoInt.trSectorFF_abs_le
    kind: theorem
    summary: "FF-sector trace bound: |Tr C_r^FF| <= C_chi e^{-J_M(r)} for 1 <= r <= chi sqrt(2M), M >= M_0, via a four-piece (x,w) split, semigroup inner collapses, and Gaussian saddle estimates."
    file: Airy1GumbelContrib/TwoInterval/SectorFF.lean
    status: internal
    keywords: [airy, two-interval, sector-estimate, fredholm-determinant, saddle-point]
  - id: airy1-gumbel-lean-contrib/two-interval-trace-bound
    decl: AiryTwoInt.abs_trace_crKerT_le_discharged
    kind: theorem
    summary: "Two-interval trace bound: |Tr C~_r| <= C_chi (1+r)^{1/2} e^{-J_M(r)} for 1 <= r <= chi sqrt(2M), M >= M_0, at a = sqrt(2M) with the MemLp inputs proved; assembled from the four sector bounds."
    file: Airy1GumbelContrib/TwoInterval/TwoIntervalTraceBound.lean
    status: internal
    keywords: [airy, two-interval, trace-estimate, fredholm-determinant, saddle-point]
  - id: airy1-gumbel-lean-contrib/two-interval-trace-near-sign
    decl: AiryTwoInt.trace_crKerT_ge_neg_discharged_a
    kind: theorem
    summary: "Near-sign lower bound for the two-interval trace: Tr C~_r >= -C e^{-a^4/64} (a = sqrt(2M), i.e. -C e^{-M^2/16}) for 1 <= r <= chi sqrt(2M), M >= M_0; via Gaussian barrier decay of Q P_r Q and Ai >= 0 on [0, infinity)."
    file: Airy1GumbelContrib/TwoInterval/TwoIntervalTraceSign.lean
    status: internal
