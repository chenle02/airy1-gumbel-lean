# The paper-to-Lean map of this companion, against the posted arXiv version 1 of the paper.
# Component results of the nested package contrib/ are listed in contrib/claims.yaml.
schema: coverage/1
package: airy1-gumbel-lean
kind: paper
manuscript:
  title: "Gumbel Fluctuations of the Maximum of the Airy_1 Process"
  version: "arXiv:2611.23658v1"
summary: "Theorem 1.1 is proved for a constructed continuous Airy_1 process under three named inputs, and since v0.10.0 under CubicStrongMixing only (GOELeftTail and Airy1FddPositive proved); Lemmas 4.1, 4.2, Proposition 4.3 and Remark 5.3 under further named inputs, each assumed. Lemmas 3.3-3.8 and B.1-B.6 are contrib results, outside only because rows name main-package claims."
rows:
  - paper: {number: "Theorem 1.1", title: "Gumbel limit of the normalized maximum"}
    class: inputs-supplied
    claims:
      - airy1-gumbel-lean/continuous-instance-headline-final2
      - airy1-gumbel-lean/continuous-instance-headline-final2-coord
    inputs:
      - "Airy1FddPositive: for every finite set of times, a probability law whose box distribution function is the Airy_1 Fredholm-determinant formula (Quastel-Remenik, Theorem 1; Borodin-Ferrari-Prahofer 2007). A hypothesis of these two theorems; proved under GOELeftTail since v0.9.0 and with no hypothesis since v0.10.0 (airy1FddPositive_holds), so the next two rows have the same conclusion without it"
      - "GOELeftTail: a cubic left-tail bound for the one-point law (Baik-Buckingham-DiFranco 2008 with the Ferrari-Spohn GOE identity); an input the paper does not need, since it starts from an existing continuous process. A hypothesis of these two theorems; proved with no hypothesis since v0.10.0 (goeLeftTail_holds)"
      - "CubicStrongMixing: strong mixing between past and future sigma-algebras at rate exp(-c d^3) (Chen-Pu, arXiv 2607.17113, Proposition 3.1)"
    note: "The process is the version of the Kolmogorov-extension law with continuous paths on [0, infinity); centering and scaling are those of (1.1)-(1.2) for real T. The mesoscopic step is proved by the two-time Fredholm determinant bound and a high-level upcrossing bound, not by association and the covariance asymptotic. The comparator checks these two statements, unchanged in v0.10.0."
  - paper: {number: "Theorem 1.1, two-input form", title: "Gumbel limit of the normalized maximum without the input Airy1FddPositive"}
    class: inputs-supplied
    claims:
      - airy1-gumbel-lean/continuous-instance-headline-final2-no-fdd-input
      - airy1-gumbel-lean/fdd-positive-of-goe-left-tail
    inputs:
      - "GOELeftTail: the cubic left-tail bound for the one-point law, as in the row above; it also supplies Airy1FddPositive, through airy1FddPositive_of_goeLeftTail"
      - "CubicStrongMixing: strong mixing between past and future sigma-algebras at rate exp(-c d^3) (Chen-Pu, arXiv 2607.17113, Proposition 3.1), stated for the process built from airy1FddPositive_of_goeLeftTail"
    note: "New in v0.9.0: the conclusion of the row above under GOELeftTail and CubicStrongMixing only. Airy1FddPositive is proved under GOELeftTail, not unconditionally (airy1FddPositive_of_goeLeftTail, via flat discrete TASEP and its scaling limit). No input is added. Both claims are compared. The coordinate form _final2_coord_no_fdd_input is built, not compared."
  - paper: {number: "Theorem 1.1, one-input form", title: "Gumbel limit of the normalized maximum under CubicStrongMixing only"}
    class: inputs-supplied
    claims:
      - airy1-gumbel-lean/gumbel-limit-continuum-real-normalized-airy1-final2-no-fdd-goe-input
      - airy1-gumbel-lean/goe-left-tail-holds
      - airy1-gumbel-lean/airy1-fdd-positive-holds
    inputs:
      - "CubicStrongMixing: strong mixing between past and future sigma-algebras at rate exp(-c d^3) (Chen-Pu, arXiv 2607.17113, Proposition 3.1), stated for the process built from airy1FddPositive_holds and goeLeftTail_holds"
    note: "New in v0.10.0: the conclusion of the first row under CubicStrongMixing only. Both records are proved with no hypothesis: goeLeftTail_holds : GOELeftTail, airy1FddPositive_holds : Airy1FddPositive. No input is added; _final2 and every original statement are unchanged and still take the records as hypotheses. All three claims are compared; _final2_no_fdd_input_no_goe_input is built, not compared."
  - paper: {number: "Proposition 1.2", title: "Two-term expansion of the one-block tail"}
    class: inputs-supplied
    claims:
      - airy1-gumbel-lean/fixed-interval-tail-expansion
      - airy1-gumbel-lean/interval-hitting-law-positive-length
      - airy1-gumbel-lean/block-law-unconditional
      - airy1-gumbel-lean/airy1law-interval-tail-sub-tracelead-islittleo-no-fdd-goe-input
      - airy1-gumbel-lean/airy1law-sup-le-eq-fredholmdet-prime-no-fdd-goe-input
    inputs:
