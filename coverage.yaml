# The paper-to-Lean map of this companion, against the posted arXiv version 1 of the paper.
# Component results of the nested package contrib/ are listed in contrib/claims.yaml.
schema: coverage/1
package: airy1-gumbel-lean
kind: paper
manuscript:
  title: "Gumbel Fluctuations of the Maximum of the Airy_1 Process"
  version: "arXiv:2611.23658v1"
summary: "Theorem 1.1 is proved for a constructed continuous Airy_1 process under three named inputs, and since v0.9.0 under GOELeftTail and CubicStrongMixing only (Airy1FddPositive proved under GOELeftTail); Lemmas 4.1, 4.2, Proposition 4.3 and Remark 5.3 under further named inputs, each assumed. Lemmas 3.3-3.8 are contrib results outside this table; Lemmas B.1-B.6 are outside."
rows:
  - paper: {number: "Theorem 1.1", title: "Gumbel limit of the normalized maximum"}
    class: inputs-supplied
    claims:
      - airy1-gumbel-lean/continuous-instance-headline-final2
      - airy1-gumbel-lean/continuous-instance-headline-final2-coord
    inputs:
      - "Airy1FddPositive: for every finite set of times, a probability law whose box distribution function is the Airy_1 Fredholm-determinant formula (Quastel-Remenik, Theorem 1; Borodin-Ferrari-Prahofer 2007). A hypothesis of these two theorems; since v0.9.0 it is proved under GOELeftTail (airy1FddPositive_of_goeLeftTail), so the next row has the same conclusion without it"
      - "GOELeftTail: a cubic left-tail bound for the one-point law (Baik-Buckingham-DiFranco 2008 with the Ferrari-Spohn GOE identity); an input the paper does not need, since it starts from an existing continuous process"
      - "CubicStrongMixing: strong mixing between past and future sigma-algebras at rate exp(-c d^3) (Chen-Pu, arXiv 2607.17113, Proposition 3.1)"
    note: "The process is the version of the Kolmogorov-extension law with continuous paths on [0, infinity); centering and scaling are those of (1.1)-(1.2) for real T. The mesoscopic step is proved by the two-time Fredholm determinant bound and a high-level upcrossing bound, not by association and the covariance asymptotic. The comparator checks these two statements, unchanged in v0.9.0."
  - paper: {number: "Theorem 1.1, two-input form", title: "Gumbel limit of the normalized maximum without the input Airy1FddPositive"}
    class: inputs-supplied
    claims:
      - airy1-gumbel-lean/continuous-instance-headline-final2-no-fdd-input
      - airy1-gumbel-lean/continuous-instance-headline-final2-coord-no-fdd-input
      - airy1-gumbel-lean/fdd-positive-of-goe-left-tail
    inputs:
      - "GOELeftTail: the cubic left-tail bound for the one-point law, as in the row above; it also supplies Airy1FddPositive, through airy1FddPositive_of_goeLeftTail"
      - "CubicStrongMixing: strong mixing between past and future sigma-algebras at rate exp(-c d^3) (Chen-Pu, arXiv 2607.17113, Proposition 3.1), stated for the process built from airy1FddPositive_of_goeLeftTail"
    note: "New in v0.9.0: the conclusion of the row above under GOELeftTail and CubicStrongMixing only. Airy1FddPositive is proved under GOELeftTail, not unconditionally (airy1FddPositive_of_goeLeftTail, via flat discrete TASEP and its scaling limit). No input is added. Built, no sorry, standard axioms; the comparator does not check these statements."
  - paper: {number: "Proposition 1.2", title: "Two-term expansion of the one-block tail"}
    class: inputs-supplied
    claims:
      - airy1-gumbel-lean/fixed-interval-tail-expansion
      - airy1-gumbel-lean/interval-hitting-law-positive-length
      - airy1-gumbel-lean/block-law-core
      - airy1-gumbel-lean/block-law-unconditional
      - airy1-gumbel-lean/sharp-tail-discharge
    inputs:
      - "Airy1FddPositive and GOELeftTail, for the process-level interval hitting law"
    note: "Proved for the continuous version of the constructed process on [0, T], for every fixed T > 0 (fixed-interval-tail-expansion). The interval hitting law is proved at any weight a >= T + 1 by the dyadic mesh limit and combined with the determinant expansion of contrib. Version 0.1.0 had the process-level statement for T >= 1 only."
  - paper: {number: "Corollary 1.3", title: "Touching blocks"}
    class: inputs-supplied
    claims:
      - airy1-gumbel-lean/touching-discharge
      - airy1-gumbel-lean/qr-block-laws-theorems
    inputs:
      - "Airy1FddPositive and GOELeftTail, for the one- and two-block laws of the constructed process"
  - paper: {number: "Proposition 1.4", title: "Separated blocks"}
    class: inputs-supplied
    claims:
      - airy1-gumbel-lean/separated-discharge
      - airy1-gumbel-lean/qr-two-interval-law-theorem
    inputs:
      - "Airy1FddPositive and GOELeftTail, for the unit-block and two-interval laws of the constructed process"
  - paper: {number: "Lemma 3.1", title: "Two-interval determinant formula"}
    class: inputs-supplied
    claims:
      - airy1-gumbel-lean/two-interval-law-equal-length
      - airy1-gumbel-lean/two-block-law
      - airy1-gumbel-lean/qr-two-interval-law-theorem
    inputs:
      - "Airy1FddPositive and GOELeftTail, for the two-interval hitting law of the constructed process"
    note: "Proved for every T > 0, r > 0, M > 0 at any weight a >= 2T + r + 1 (two-interval-law-equal-length), in the trace-class form (3.3) of Remark 3.2: det(I - K~), K~ the conjugated kernel of (3.2). The determinant displayed in (3.1) has no separate Lean definition; the paper reads it through (3.3). Versions 0.1.0 and 0.2.0 had T = 1 only."
  - paper: {number: "Lemma 3.3", title: "Joint inclusion for separated blocks"}
    class: outside
    note: "In a different form, not a claim of this table: joint_exceed_eq_detComb (Airy1Gumbel/Separated.lean) holds eventually in u (the paper: sqrt(2M) >= r + 3) under the QR block-law records, proved for airy1Law under Airy1FddPositive and GOELeftTail; the decomposition is AiryTwoInt.twoIntKCup_decomp (contrib TwoInterval/TwoIntervalOps.lean), as stated."
  - paper: {number: "Lemma 3.4", title: "Interaction trace formula"}
    class: outside
    note: "In a different form in contrib, not a claim of this table: C_r is trace class (AiryTwoInt.isTraceClass_crKerT, TwoInterval/TwoIntervalMembership.lean) with trace the sum of four sector traces, each an iterated integral (AiryTwoInt.trace_crKerT_eq_sectors, TwoInterval/TwoIntervalTrace.lean); absolute convergence over R^4 is not stated."
  - paper: {number: "Lemma 3.5", title: "RR trace"}
    class: outside
    note: "In a different form in contrib, not a claim of this table: the saddle bound as stated (AiryConj.saddleF_ge, AiryKernel/GaussianSaddle.lean); the RR bound (AiryTwoInt.trSectorRR_abs_le, TwoInterval/SectorRR.lean) has an extra term C2 exp(-c2 M^2), absorbed only in AiryTwoInt.abs_trace_crKerT_le_discharged (TwoInterval/TwoIntervalTraceBound.lean)."
  - paper: {number: "Lemma 3.6", title: "Mixed traces"}
    class: outside
    note: "Proved as stated in the contrib package, not a claim of this table (rows name main-package claims only): AiryTwoInt.trSectorRF_eq_trSectorFR (contrib/Airy1GumbelContrib/TwoInterval/SectorRF.lean) and AiryTwoInt.abs_trSectorFR_le_absorbed (TwoInterval/SectorFR.lean). Used by Proposition 1.4."
  - paper: {number: "Lemma 3.7", title: "FF trace"}
    class: outside
    note: "Proved as stated in the contrib package, not a claim of this table (rows name main-package claims only): AiryTwoInt.trSectorFF_abs_le (contrib/Airy1GumbelContrib/TwoInterval/SectorFF.lean). Used by Proposition 1.4."
  - paper: {number: "Lemma 3.8", title: "Joint trace norms"}
    class: outside
    note: "In a weaker form in contrib, not a claim of this table: traces and Hilbert-Schmidt norms are bounded (AiryTwoInt.twoInt_stepThree, TwoInterval/TwoIntervalDetRem.lean; AiryTwoInt.hsNorm_crKerT_le_discharged, TwoInterval/TwoIntervalN3.lean; AiryTwoInt.abs_trace_crKerT_le_discharged), but no trace-norm bound is stated; Proposition 1.4 uses this form."
  - paper: {number: "Lemma 4.1", title: "Block modulus"}
    class: inputs-supplied
    claims:
      - airy1-gumbel-lean/block-modulus-lemma-4-1
      - airy1-gumbel-lean/nonnegative-window-modulus-input
      - airy1-gumbel-lean/nonnegative-window-modulus-constant
      - airy1-gumbel-lean/nonnegative-window-modulus-falsity-witness
    inputs:
      - "NonnegativeWindowModulusEstimate, assumed, not proved: the transferred local oscillation bound (4.2) of arXiv:2611.23658v1 on windows inside [0, infinity): for large l, 0 < s <= 1 and centres c >= s, P(|A(t1) - A(t2)| > C0 l sqrt(s) for some t1, t2 in [c - s, c + s]) <= C0 exp(-c0 l). The paper derives it from Basu-Bhattacharjee (2024, arXiv 2406.11826); that derivation is not formalized"
      - "Airy1FddPositive and GOELeftTail, for the continuous version of the constructed process"
    note: "Proved as eq. (4.1) for the continuous version on [0, 1] (block-modulus-lemma-4-1). The input is new in v0.4.0; the zero process satisfies it and the process t^2 violates it (the two audit claims). The headline (Theorem 1.1) does not use this lemma or the new input: its mesoscopic step goes through a high-level upcrossing bound."
  - paper: {number: "Lemma 4.2", title: "Pair bound under association"}
    class: inputs-supplied
    claims:
      - airy1-gumbel-lean/threshold-sensitive-newman-lemma-4-2
      - airy1-gumbel-lean/airy1-continuous-point-second-moment
      - airy1-gumbel-lean/airy1-one-point-tail-shift
      - airy1-gumbel-lean/airy1-one-point-tail-profile
      - airy1-gumbel-lean/goe-singleton-right-tail
      - airy1-gumbel-lean/goe-operator-diagonal-trace
    inputs:
      - "ProcessAssociated, assumed, not proved: the association of the Airy_1 process (Pu 2025, Theorem 1.2), in the form that every finite-dimensional marginal gives nonnegative covariance to bounded, monotone, measurable test functions. An existing named input, until v0.5.0 used only by the earlier association-route headline"
      - "Airy1FddPositive and GOELeftTail, standing inputs for the continuous version of the constructed process; GOELeftTail is not a hypothesis of the paper's Lemma 4.2"
    note: "Proved as eq. (4.3) for every u >= u0 and every lag d >= 0, constants independent of d. The covariance is genuine: both marginals are proved square-integrable. The one-point tail ratio, from a density bound in the paper, is proved from the GOE Fredholm determinant: no new named input. The headline (Theorem 1.1) does not use this lemma."
  - paper: {number: "Proposition 4.3", title: "Mesoscopic sum"}
    class: inputs-supplied
    claims:
      - airy1-gumbel-lean/standalone-mesoscopic-sum-prop-4-3
      - airy1-gumbel-lean/mesoscopic-block-pair-grid-cover
      - airy1-gumbel-lean/one-point-tail-minus-one
      - airy1-gumbel-lean/unit-block-oscillation-shift
      - airy1-gumbel-lean/unit-block-oscillation-event
    inputs:
      - "NonnegativeWindowModulusEstimate, assumed, not proved: the transferred local oscillation bound (4.2) on windows inside [0, infinity) (Basu-Bhattacharjee 2024); already the input of Lemma 4.1, through which it is used"
      - "ProcessAssociated, assumed, not proved: the association of the Airy_1 process (Pu 2025, Theorem 1.2); already the input of Lemma 4.2, through which it is used"
      - "CubicCovarianceDecay, assumed, not proved: the covariance asymptotic of the Airy_1 process (Basu-Busani-Ferrari 2023, Theorem 1.1), as the upper bound Cov(A(0), A(d)) <= exp(c d^2 - (4/3) d^3) for d > 1; used only through its proved corollary Cov(A(0), A(d)) <= exp(-theta d^3) for theta < 4/3 and large d. Until v0.6.0 used only by the earlier association-route headline and its intermediate forms"
      - "Airy1FddPositive and GOELeftTail, standing inputs for the continuous version of the constructed process"
    note: "Proved as eq. (4.6) for the block maxima Y_j of the continuous version, every chi in ((1/2)^(1/3), 1) and every cutoff R(M) = O(sqrt(M)), M real (mesoscopic_sum_airy1), along the paper's route. No new named input. The headline does not use this result or these three inputs; it proves the Section 5.2 specialisation along the two-point route (mesoscopic-of-bounds-tp)."
  - paper: {number: "Lemmas 5.1-5.2", title: "Centering, normalization and the blocking assembly of Section 5.2"}
    class: inputs-supplied
    claims:
      - airy1-gumbel-lean/normalization-centering
      - airy1-gumbel-lean/normalization-scaling
      - airy1-gumbel-lean/decouple-discharge
      - airy1-gumbel-lean/gumbel-limit-conditional
      - airy1-gumbel-lean/mesoscopic-of-bounds-tp
    inputs:
      - "CubicStrongMixing, for the decoupling of distant blocks"
  - paper: {number: "Remark 5.3", title: "Persistence derivation"}
    class: inputs-supplied
    claims:
      - airy1-gumbel-lean/ferrari-liu-gumbel-limit-remark-5-3
      - airy1-gumbel-lean/ferrari-liu-persistence-input
      - airy1-gumbel-lean/ferrari-liu-persistence-remainders
      - airy1-gumbel-lean/ferrari-liu-rate-normalization
      - airy1-gumbel-lean/ferrari-liu-kappa-div-rho-limit
    inputs:
      - "FerrariLiuPersistence, assumed, not proved: the finite-length persistence expansion of Ferrari-Liu (2024, Theorem 1.1, Proposition 2.5, Section 2.4): for c >= 3/2 and L >= 1, P(A <= c on [0, L]) = exp(-L kappa(c) - S(c) + E(c, L)), |S(c)| <= -6 log(1 - 2 beta(c)), E(c, L) bounded by their trace remainder; it includes their identity log det(1 - K) = -sum Tr(K^n)/n. Used only by Remark 5.3"
      - "Airy1FddPositive and GOELeftTail, standing inputs for the continuous version of the constructed process"
    note: "Proved as the remark states: P(A(x) <= a_N + b_N z for all x in [0, N]) -> exp(-e^(-z)) along integer N, every real z (gumbel_limit_continuum_airy1_ferrariLiu). The input is new in v0.8.0. The summation of the error series and kappa(c) ~ rho(c) are proved. The headline (Theorem 1.1) does not use this result or FerrariLiuPersistence, and its three inputs are unchanged."
  - paper: {number: "Lemmas B.1-B.6", title: "Auxiliary operator estimates of Appendix B"}
    class: outside
    note: "The auxiliary Airy-integral, Hilbert-Schmidt, weighted heat-operator and Gaussian-convolution estimates of the paper's proofs. Not checked as stated here. The contrib package proves its own estimates of this kind (e.g. Airy/AiryLaplace.lean, AiryKernel/Conjugate*.lean), used by the results above; they are not mapped to Lemmas B.1-B.6."
