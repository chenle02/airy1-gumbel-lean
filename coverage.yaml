    note: "Proved at the process level on [0, T] for every T > 0 (fixed-interval-tail-expansion), from the contrib expansion AiryConj.piT_sub_traceLead_isLittleO, the hitting law at weight a >= T + 1 and the eventual determinant agreement; block-law-unconditional is the law for T >= 1. Since v0.10.0 both with no input (_no_fdd_goe_input). Version 0.1.0 had the process-level statement for T >= 1 only."
