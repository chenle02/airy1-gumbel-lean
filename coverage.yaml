    note: "Proved for every T > 0, r > 0, M > 0 at any weight a >= 2T + r + 1 (two-interval-law-equal-length), in the trace-class form (3.3) of Remark 3.2: det(I - K~), K~ the conjugated kernel of (3.2). The determinant displayed in (3.1) has no separate Lean definition; the paper reads it through (3.3). Versions 0.1.0 and 0.2.0 had T = 1 only."
  - paper: {number: "Lemma 3.3", title: "Joint inclusion for separated blocks"}
    class: outside
    note: "Proved in a different form: joint_exceed_eq_detComb (Airy1Gumbel/Separated.lean) holds eventually in u (paper: sqrt(2M) >= r + 3) under the QR records, proved for airy1Law under Airy1FddPositive and GOELeftTail; the decomposition, AiryTwoInt.twoIntKCup_decomp (contrib TwoInterval/TwoIntervalOps.lean), as stated. Shown as outside only because coverage rows can name main-package claims alone."
  - paper: {number: "Lemma 3.4", title: "Interaction trace formula"}
    class: outside
    note: "Proved in contrib in a different form: C_r trace class (AiryTwoInt.isTraceClass_crKerT, TwoInterval/TwoIntervalMembership.lean), trace = sum of four sector traces as iterated integrals (AiryTwoInt.trace_crKerT_eq_sectors, TwoInterval/TwoIntervalTrace.lean); no R^4 absolute-convergence statement. Shown as outside only because coverage rows can name main-package claims alone."
